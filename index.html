<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Skylark Support</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="Web-icon.JPEG" />

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "San Francisco", Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 14px;
    }

    .back-btn {
      margin-top: 25px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.85;
    }

    footer {
      margin-top: 15px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Skylark Support</h1>
    <p>Find help articles and guides for Skylark services.</p>

   <div class="status">
  <a href="wallpaper-unable-to-set.html">
    Wallpaper was unable to set
  </a>
</div>

    <button class="back-btn" onclick="history.back()">
      Go Back
    </button>

    <footer>
      © Skylark Inc
    </footer>
  </div>
</body>
</html>
